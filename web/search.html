<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Поиск фьючерсов</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1e1e2f; color: #cdd6f4; margin: 20px; }
        h1 { text-align: center; color: #89b4fa; }
        .container { max-width: 800px; margin: 0 auto; }
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex-grow: 1; padding: 10px; border-radius: 5px; border: 1px solid #45475a; background: #313244; color: #cdd6f4; font-size: 16px; }
        input:focus { outline: none; border-color: #89b4fa; }
        button { padding: 10px 20px; border-radius: 5px; border: none; background: #89b4fa; color: #1e1e2f; font-weight: bold; cursor: pointer; font-size: 16px; }
        button:hover { background: #b4befe; }
        button:disabled { background: #45475a; color: #6c7086; cursor: not-allowed; }
        .result-item { background: #313244; padding: 15px; margin-bottom: 10px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; }
        .result-info { flex-grow: 1; }
        .result-title { font-weight: bold; color: #89b4fa; margin-bottom: 5px; }
        .result-uid { font-size: 12px; color: #6c7086; font-family: monospace; }
        .back-link { display: block; text-align: center; margin-top: 30px; color: #a6adc8; text-decoration: none; font-size: 14px; }
        .back-link:hover { color: #89b4fa; }
        .status { text-align: center; margin-bottom: 20px; color: #a6adc8; }
        .error { color: #f38ba8; }
        .success { color: #a6e3a1; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Поиск фьючерсов</h1>
        <p style="text-align: center; color: #a6adc8; font-size: 14px; margin-bottom: 20px;">
            Введите тикер или название <b>фьючерса</b>. Примеры: <b>SRU6</b> (Сбер), <b>LKZ6</b> (Лукойл), <b>X5U6</b> (X5).
        </p>
        <div class="search-box">
            <input type="text" id="query" placeholder="Тикер или название фьючерса (например, SRU6, Сбербанк)" autofocus />
            <button id="search-btn" onclick="search()">Искать</button>
        </div>

        <div id="status" class="status"></div>
        <div id="results"></div>
        
        <a href="/" class="back-link">← Вернуться к монитору</a>
    </div>

    <script>
        const queryInput = document.getElementById('query');
        const searchBtn = document.getElementById('search-btn');
        const resultsDiv = document.getElementById('results');
        const statusDiv = document.getElementById('status');

        // Поиск по нажатию Enter
        queryInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') search();
        });

        async function search() {
            const query = queryInput.value.trim();
            if (!query) return;

            resultsDiv.innerHTML = '';
            statusDiv.textContent = '⏳ Идёт поиск...';
            statusDiv.className = 'status';
            searchBtn.disabled = true;

            try {
                const res = await fetch('/api/search?q=' + encodeURIComponent(query));
                if (!res.ok) {
                    const errText = await res.text();
                    throw new Error(errText || 'Ошибка поиска');
                }
                const data = await res.json();

                searchBtn.disabled = false;

                if (data.length === 0) {
                    statusDiv.textContent = 'Ничего не найдено.';
                    return;
                }

                statusDiv.textContent = 'Найдено: ' + data.length;
                data.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'result-item';
                    div.innerHTML = 
                        '<div class="result-info">' +
                            '<div class="result-title">' + item.ticker + ' (' + item.name + ')</div>' +
                            '<div>Фьючерс: ' + (item.future_price ? item.future_price.toFixed(2) + ' ₽' : '—') + '</div>' +
                            '<div>Акция: ' + item.stock_ticker + ' — ' + (item.stock_price ? item.stock_price.toFixed(2) + ' ₽' : '—') + '</div>' +
                        '</div>' +
                        '<button onclick="addPair(\'' + item.uid + '\', \'' + item.ticker + '\', this)">Добавить</button>';
                    resultsDiv.appendChild(div);
                });
            } catch (e) {
                searchBtn.disabled = false;
                statusDiv.textContent = 'Ошибка: ' + e.message;
                statusDiv.className = 'status error';
            }
        }

        async function addPair(uid, ticker, btn) {
            if (!confirm('Добавить пару с фьючерсом ' + ticker + '?')) return;

            btn.disabled = true;
            btn.textContent = 'Добавление...';

            try {
                const res = await fetch('/api/add-pair', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ future_uid: uid, future_ticker: ticker })
                });

                if (!res.ok) {
                    const errText = await res.text();
                    throw new Error(errText || 'Ошибка добавления');
                }

                const result = await res.json();
                statusDiv.textContent = '✅ Пара ' + (result.pair ? result.pair.Name : ticker) + ' успешно добавлена!';
                statusDiv.className = 'status success';
                btn.textContent = 'Добавлено';
                // Никакого редиректа — остаёмся на странице
            } catch (e) {
                btn.disabled = false;
                btn.textContent = 'Добавить';
                statusDiv.textContent = 'Ошибка: ' + e.message;
                statusDiv.className = 'status error';
            }
        }
    </script>
</body>
</html>
